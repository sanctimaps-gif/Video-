[project]
name = "sanctimaps-video-agent"
version = "0.1.0"
description = "Agent réalisateur vidéo spécialisé dans SanctiMaps (https://sanctimaps.fr)"
requires-python = ">=3.10"
dependencies = ["playwright>=1.45", "imageio-ffmpeg>=0.5", "numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
ai = ["anthropic>=0.70"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sanctimaps-video = "sanctimaps_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sanctimaps_agent*"]
